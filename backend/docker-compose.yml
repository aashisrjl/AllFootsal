services:
  backend:
    build: .
    container_name: futsal-backend
    restart: always
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:3000"
    networks:
      - services
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  services:
    external: false
    name: services
    driver: bridge
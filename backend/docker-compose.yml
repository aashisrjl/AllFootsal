services:
  backend:
    build: .
    container_name: futsal-backend
    restart: always
    # Load app/env vars solely from docker-mariadb-pma/.env
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:3000"
    networks:
      - services

networks:
  services:
    external: true
    name: ${PROJECT:-futsal}
    driver: bridge


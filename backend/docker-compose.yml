version: '3.8'

services:
  backend:
    build: .
    container_name: futsal-backend
    restart: always
    # Load app/env vars solely from docker-mariadb-pma/.env
    env_file:
      - ./docker-mariadb-pma/.env
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - services

networks:
  services:
    external: true
    name: ${PROJECT}-futsal
    driver: bridge

volumes:
  mariadb_data:


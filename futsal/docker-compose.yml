services:
  futsal:
    build: .
    container_name: futsal-dashboard
    restart: always
    ports:
      - "3002:3002"
    environment:
      - VITE_API_URL=http://localhost:3000
    networks:
      - services
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

networks:
  services:
    external: false
    name: services
    driver: bridge
